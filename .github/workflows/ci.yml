name: Build & Deploy
on:
  push:
    branches:
      - master
      - main

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
    - uses: actions/setup-node@v7
      with:
        node-version: '26'

    - name: Setup Yarn
      run: |
        npm install --global corepack@0.36.0
        corepack enable
        yarn set version 3.2.1

    - name: Get yarn cache directory path
      id: yarn-cache-dir-path
      run: echo "dir=$(yarn config get cacheFolder)" >> $GITHUB_OUTPUT

    - name: Cache node modules
      uses: actions/cache@v6
      with:
        path: ${{ steps.yarn-cache-dir-path.outputs.dir }}
        key: ${{ runner.os }}-node-26-yarn-${{ hashFiles('**/yarn.lock') }}
        restore-keys: |
          ${{ runner.os }}-node-26-yarn-

    - name: Install dependencies
      run: yarn install

    - name: Build library
      run: yarn build

    - name: Verify package exports
      run: yarn test:package

    - name: Build documentation
      run: yarn build-doc
      
    - name: Run tests
      run: yarn test

    - name: Resolve package version
      id: version
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        tag=v$(node -p "require('./package.json').version")
        echo "tag=$tag" >> "$GITHUB_OUTPUT"
        # The singular /git/ref/ endpoint requires an exact match; the plural
        # /git/refs/ endpoint also matches prefixes (e.g. prerelease tags).
        if gh api "repos/${{ github.repository }}/git/ref/tags/$tag" --silent; then
          echo "tag_exists=true" >> "$GITHUB_OUTPUT"
        else
          echo "tag_exists=false" >> "$GITHUB_OUTPUT"
        fi
        if gh api "repos/${{ github.repository }}/releases/tags/$tag" --silent; then
          echo "release_exists=true" >> "$GITHUB_OUTPUT"
        else
          echo "release_exists=false" >> "$GITHUB_OUTPUT"
        fi

    - name: Deploy documentation
      uses: peaceiris/actions-gh-pages@v3
      with:
        github_token: ${{ secrets.GITHUB_TOKEN }}
        publish_dir: ./demo

    - name: Create Tag
      if: steps.version.outputs.tag_exists == 'false'
      run: |
        git config user.name github-actions
        git config user.email 41898282+github-actions[bot]@users.noreply.github.com
        git tag ${{ steps.version.outputs.tag }}
        git push origin ${{ steps.version.outputs.tag }}

    - name: Create Release
      uses: ncipollo/release-action@v1
      if: steps.version.outputs.release_exists == 'false'
      with:
        name: ${{ steps.version.outputs.tag }}
        tag: ${{ steps.version.outputs.tag }}
        token: ${{ secrets.GITHUB_TOKEN }}
        generateReleaseNotes: true
        skipIfReleaseExists: true
        body: |
          [![](https://img.shields.io/badge/Open%20in-unpkg-blue)](https://uiwjs.github.io/npm-unpkg/#/pkg/@itseasy21/react-elastic-carousel@${{ steps.version.outputs.tag }}/file/README.md) [![npm bundle size](https://img.shields.io/bundlephobia/minzip/@itseasy21/react-elastic-carousel)](https://www.npmjs.com/package/@itseasy21/react-elastic-carousel)

          ```bash
          npm i @itseasy21/react-elastic-carousel@${{ steps.version.outputs.tag }}
          ```

    - name: Publish to NPM
      uses: JS-DevTools/npm-publish@v2
      # Always runs: npm-publish skips versions already on the registry, so a
      # rerun can still publish after a failed release attempt.
      with:
        token: ${{ secrets.NPM_TOKEN }}
        access: public